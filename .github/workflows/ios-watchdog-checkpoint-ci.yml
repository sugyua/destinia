name: iOS watchdog checkpoint CI

on:
  push:
    branches:
      - codex/ios-055-freeze-watchdog-b29
    paths:
      - "ios/TCIProbe/stall_watchdog.h"
      - "ios/TCIProbe/stall_watchdog_test.cpp"
      - "ios/TCIProbe/main.mm"
      - ".github/workflows/ios-watchdog-checkpoint-ci.yml"
  pull_request:
    branches:
      - ios/unicorn-poc
    paths:
      - "ios/TCIProbe/stall_watchdog.h"
      - "ios/TCIProbe/stall_watchdog_test.cpp"
      - "ios/TCIProbe/main.mm"
      - ".github/workflows/ios-watchdog-checkpoint-ci.yml"
  workflow_dispatch:

jobs:
  compile-check-only:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test native watchdog and symbol names
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror \
            ios/TCIProbe/stall_watchdog_test.cpp -o /tmp/destinia-stall-test
          /tmp/destinia-stall-test
      - name: Compile iOS ARM64 Objective-C++ only (no IPA, no game assets)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -x objective-c++ \
            -std=c++17 -fobjc-arc -O2 \
            -DDESTINIA_STALL_DIAGNOSTICS=1 \
            -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -c ios/TCIProbe/main.mm -o /tmp/destinia-ios-watchdog.o
          file /tmp/destinia-ios-watchdog.o
