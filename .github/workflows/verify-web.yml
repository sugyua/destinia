name: Destinia Web tests

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/verify-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/verify-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    name: Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run Web tests
        run: npm test
        env:
          DESTINIA_GAME_ROOT: ${{ github.workspace }}/game
        working-directory: web
