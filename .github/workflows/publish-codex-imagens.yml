name: Publicar pacote verificado do Codex com imagens
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-codex-imagens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Baixar os pacotes da compilacao Windows aprovada
        uses: actions/download-artifact@v4
        with:
          name: destinia-codex-no-menu-pacotes-de-teste
          path: verified-packages
          run-id: 39676483793
          github-token: ${{ github.token }}
      - name: Conferir integridade e anexar os pacotes a prerelease autorizada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd verified-packages
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum -c destinia-0.7-beta-source.zip.sha256
          sha256sum -c destinia-0.7-beta-windows-x64.zip.sha256
          printf '%s\n' \
            '89d91d247c50cd51bf0e930af31d179cd5145330110af623402d709147c80a71  destinia-0.7-beta-source.zip' \
            '248313d0b3a4adbc735b877a28883c1b12941ae1dbc551d1326ee132685a22e0  destinia-0.7-beta-windows-x64.zip' | sha256sum -c -
          gh release view v0.7-codex-imagens --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v0.7-codex-imagens \
            destinia-0.7-beta-windows-x64.zip destinia-0.7-beta-windows-x64.zip.sha256 \
            destinia-0.7-beta-source.zip destinia-0.7-beta-source.zip.sha256 \
            --repo "$GITHUB_REPOSITORY"
