name: iOS Device Diagnostics

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - ".github/workflows/ios-device-diagnostics.yml"
      - "ios/**"
  workflow_dispatch:

jobs:
  ios-diagnostics:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout Destinia
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check ARM64 iOS compiler
        run: |
          cat > /tmp/ios_check.c <<'EOF'
          int destinia_ios_check(void) {
              return 42;
          }
          EOF

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -target arm64-apple-ios15.0 \
            -c /tmp/ios_check.c \
            -o /tmp/ios_check.o

          file /tmp/ios_check.o

      - name: Check build tools
        run: |
          cmake --version
          xcodebuild -showsdks

      - name: Download libffi 3.4.6
        run: |
          curl -fL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz -o /tmp/libffi.tar.gz
          tar -xzf /tmp/libffi.tar.gz -C /tmp

      - name: Configure libffi for iOS ARM64
        run: |
          cd /tmp/libffi-3.4.6
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK"
          export LDFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK"

          ./configure \
            --host=aarch64-apple-darwin \
            --build="$(./config.guess)" \
            --disable-shared \
            --enable-static \
            --disable-multi-os-directory

      - name: Disable libffi CFI for diagnostic build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/libffi-3.4.6/include/ffi_cfi.h")
          s = p.read_text()
          old = "#ifdef HAVE_AS_CFI_PSEUDO_OP"
          assert s.count(old) == 1
          s = s.replace(old, "#if 0 /* diagnostic: disable CFI */")
          p.write_text(s)
          print("CFI disabled for diagnostic build")
          PY
      - name: Compile libffi
        run: |
          cd /tmp/libffi-3.4.6
          make -j2

      - name: Inspect libffi
        run: |
          cd /tmp/libffi-3.4.6
          LIB=$(find . -name libffi.a -print -quit)
          test -n "$LIB"
          xcrun lipo -info "$LIB"
          xcrun ar -t "$LIB" | head -20

      - name: Clone Unicorn TCI
        run: |
          git clone --depth 1 https://github.com/1rhino2/unicorn-tci.git /tmp/unicorn-tci
          git -C /tmp/unicorn-tci rev-parse HEAD

      - name: Build Unicorn TCI for iOS ARM64
        run: |
          set -eux
          export ARCHFLAGS="-arch arm64"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S /tmp/unicorn-tci/unicorn-engine-sys-tci \
            -B /tmp/unicorn-tci-ios-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DUNICORN_ARCH=arm \
            -DUNICORN_INTERPRETER=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=OFF
          cmake --build /tmp/unicorn-tci-ios-build --target unicorn --parallel 2

      - name: Inspect Unicorn TCI library
        run: |
          set -eux
          for NAME in libunicorn-static.a libunicorn-common.a libarm-softmmu.a; do
            LIB="/tmp/unicorn-tci-ios-build/$NAME"
            test -f "$LIB"
            file "$LIB"
            xcrun lipo -info "$LIB"
            xcrun ar -t "$LIB" | sed -n '1,10p'
          done

      - name: Run ARM32 TCI smoke test on macOS
        run: |
          set -eux

          export ARCHFLAGS="-arch arm64"

          cmake -S /tmp/unicorn-tci/unicorn-engine-sys-tci \
            -B /tmp/unicorn-tci-macos-build \
            -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUNICORN_ARCH=arm \
            -DUNICORN_INTERPRETER=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=OFF

          cmake --build /tmp/unicorn-tci-macos-build \
            --target unicorn --parallel 2

          cat > /tmp/uc_tci_smoke.c <<'EOF'
          #include <stdint.h>
          #include <stdio.h>
          #include <unicorn/unicorn.h>

          #define CHECK(expr) do { \
              uc_err e = (expr); \
              if (e != UC_ERR_OK) { \
                  fprintf(stderr, "%s: %s\n", #expr, uc_strerror(e)); \
                  return 1; \
              } \
          } while (0)

          int main(void) {
              uc_engine *uc = NULL;
              const uint8_t code[] = {0x2a, 0x00, 0xa0, 0xe3};
              uint32_t r0 = 0;

              CHECK(uc_open(UC_ARCH_ARM, UC_MODE_ARM, &uc));
              CHECK(uc_mem_map(uc, 0x1000, 0x1000, UC_PROT_ALL));
              CHECK(uc_mem_write(uc, 0x1000, code, sizeof(code)));
              CHECK(uc_emu_start(uc, 0x1000, 0x1004, 0, 0));
              CHECK(uc_reg_read(uc, UC_ARM_REG_R0, &r0));

              printf("ARM32 TCI RESULT: %u\n", r0);
              uc_close(uc);

              return r0 == 42 ? 0 : 1;
          }
          EOF

          clang \
            -I/tmp/unicorn-tci/unicorn-engine-sys-tci/include \
            /tmp/uc_tci_smoke.c \
            /tmp/unicorn-tci-macos-build/libunicorn-static.a \
            /tmp/unicorn-tci-macos-build/libarm-softmmu.a \
            /tmp/unicorn-tci-macos-build/libunicorn-common.a \
            -lm -lpthread \
            -o /tmp/uc_tci_smoke

          /tmp/uc_tci_smoke

      - name: Link Unicorn TCI into iOS ARM64 executable
        run: |
          set -eux

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -I/tmp/unicorn-tci/unicorn-engine-sys-tci/include \
            /tmp/uc_tci_smoke.c \
            /tmp/unicorn-tci-ios-build/libunicorn-static.a \
            /tmp/unicorn-tci-ios-build/libarm-softmmu.a \
            /tmp/unicorn-tci-ios-build/libunicorn-common.a \
            -lm -lpthread \
            -o /tmp/uc_tci_ios_link

          file /tmp/uc_tci_ios_link
          xcrun lipo -info /tmp/uc_tci_ios_link
          xcrun vtool -show-build /tmp/uc_tci_ios_link

      - name: List Destinia unresolved imports
        run: |
          set -eux

          cat > /tmp/list_destinia_imports.cpp <<'EOF'
          #include "common/elf_image.h"
          #include <fstream>
          #include <iostream>
          #include <iterator>
          #include <set>
          #include <vector>

          int main() {
              std::ifstream f(
                  "game/lib/armeabi/libdestinia_jni.so",
                  std::ios::binary);

              if (!f) return 1;

              std::vector<uint8_t> data(
                  (std::istreambuf_iterator<char>(f)),
                  std::istreambuf_iterator<char>());

              destinia::ArmElfImage elf;
              elf.parse(data);

              std::set<std::string> names;

              for (const auto &r : elf.relocations) {
                  if (r.type != 2 && r.type != 21 && r.type != 22)
                      continue;

                  const auto &sym = elf.symbols.at(r.symbol);

                  if (sym.shndx == 0)
                      names.insert(elf.names.at(r.symbol));
              }

              std::cout << "=== IMPORTS PENDENTES ===\n";

              for (const auto &name : names)
                  std::cout << name << "\n";

              std::cout << "TOTAL: " << names.size() << "\n";

              return 0;
          }
          EOF

          clang++ -std=c++17 -iquote . \
            /tmp/list_destinia_imports.cpp \
            -o /tmp/list_destinia_imports

          /tmp/list_destinia_imports
      - name: Build TCIProbe IPA
        run: |
          set -eux

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ROOT="/tmp/tci-probe-package"
          APP="$ROOT/Payload/TCIProbe.app"

          mkdir -p "$APP"
          cp game/lib/armeabi/libdestinia_jni.so "$APP/libdestinia_jni.so"

          xcrun --sdk iphoneos clang++ \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -O2 \
            -std=c++17 \
            -I/tmp/unicorn-tci/unicorn-engine-sys-tci/include \
            ios/TCIProbe/main.mm \
            ios/TCIProbe/elf_probe.cpp \
            /tmp/unicorn-tci-ios-build/libunicorn-static.a \
            /tmp/unicorn-tci-ios-build/libarm-softmmu.a \
            /tmp/unicorn-tci-ios-build/libunicorn-common.a \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -lm -lpthread \
            -o "$APP/TCIProbe"

          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>com.destinia.tcidiagnostic</string>
            <key>CFBundleName</key>
            <string>TCIProbe</string>
            <key>CFBundleDisplayName</key>
            <string>TCI Probe</string>
            <key>CFBundleExecutable</key>
            <string>TCIProbe</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>2</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIDeviceFamily</key>
            <array><integer>1</integer></array>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          PLIST

          test -s "$APP/libdestinia_jni.so"
          plutil -lint "$APP/Info.plist"
          file "$APP/TCIProbe"
          xcrun vtool -show-build "$APP/TCIProbe"

          cd "$ROOT"
          zip -qry /tmp/TCIProbe-unsigned.ipa Payload

          unzip -l /tmp/TCIProbe-unsigned.ipa

      - name: Upload TCIProbe IPA
        uses: actions/upload-artifact@v4
        with:
          name: TCIProbe-iOS-unsigned
          path: /tmp/TCIProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
