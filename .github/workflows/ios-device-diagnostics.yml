name: iOS Device Diagnostics

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - ".github/workflows/ios-device-diagnostics.yml"
      - "ios/**"
  workflow_dispatch:

jobs:
  ios-diagnostics:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout Destinia
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check ARM64 iOS compiler
        run: |
          cat > /tmp/ios_check.c <<'EOF'
          int destinia_ios_check(void) {
              return 42;
          }
          EOF

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -target arm64-apple-ios15.0 \
            -c /tmp/ios_check.c \
            -o /tmp/ios_check.o

          file /tmp/ios_check.o

      - name: Check build tools
        run: |
          cmake --version
          xcodebuild -showsdks

      - name: Download libffi 3.4.6
        run: |
          curl -fL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz -o /tmp/libffi.tar.gz
          tar -xzf /tmp/libffi.tar.gz -C /tmp

      - name: Configure libffi for iOS ARM64
        run: |
          cd /tmp/libffi-3.4.6
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK"
          export LDFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK"

          ./configure \
            --host=aarch64-apple-darwin \
            --build="$(./config.guess)" \
            --disable-shared \
            --enable-static \
            --disable-multi-os-directory

      - name: Patch libffi ARM64 CFI for Apple assembler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/libffi-3.4.6/src/aarch64/sysv.S")
          s = p.read_text()

          old1 = "cfi_def_cfa(x1, 40);"
          new1 = "cfi_def_cfa(x1, 40)"

          old2 = "cfi_adjust_cfa_offset (ffi_closure_SYSV_FS)"
          new2 = "cfi_adjust_cfa_offset (272)"

          assert old1 in s, "Primeira expressao nao encontrada"
          assert old2 in s, "Segunda expressao nao encontrada"

          s = s.replace(old1, new1)
          s = s.replace(old2, new2)
          s = s.replace(
              "cfi_adjust_cfa_offset (-ffi_closure_SYSV_FS)",
              "cfi_adjust_cfa_offset (-272)"
          )

          p.write_text(s)
          print("Patch aplicado")
          PY
      - name: Compile libffi
        run: |
          cd /tmp/libffi-3.4.6
          make -j2

      - name: Inspect libffi
        run: |
          cd /tmp/libffi-3.4.6
          LIB=$(find . -name libffi.a -print -quit)
          test -n "$LIB"
          xcrun lipo -info "$LIB"
          xcrun ar -t "$LIB" | head -20
