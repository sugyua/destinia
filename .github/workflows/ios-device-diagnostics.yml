name: iOS Device Diagnostics

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - ".github/workflows/ios-device-diagnostics.yml"
      - "ios/**"
  workflow_dispatch:

jobs:
  ios-diagnostics:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout Destinia
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check ARM64 iOS compiler
        run: |
          cat > /tmp/ios_check.c <<'EOF'
          int destinia_ios_check(void) {
              return 42;
          }
          EOF

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -target arm64-apple-ios15.0 \
            -c /tmp/ios_check.c \
            -o /tmp/ios_check.o

          file /tmp/ios_check.o

      - name: Check build tools
        run: |
          cmake --version
          xcodebuild -showsdks

      - name: Download libffi 3.4.6
        run: |
          curl -fL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz -o /tmp/libffi.tar.gz
          tar -xzf /tmp/libffi.tar.gz -C /tmp

      - name: Configure libffi for iOS ARM64
        run: |
          cd /tmp/libffi-3.4.6
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK"
          export LDFLAGS="-target arm64-apple-ios15.0 -isysroot $SDK"

          ./configure \
            --host=aarch64-apple-darwin \
            --build="$(./config.guess)" \
            --disable-shared \
            --enable-static \
            --disable-multi-os-directory

      - name: Disable libffi CFI for diagnostic build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("/tmp/libffi-3.4.6/include/ffi_cfi.h")
          s = p.read_text()
          old = "#ifdef HAVE_AS_CFI_PSEUDO_OP"
          assert s.count(old) == 1
          s = s.replace(old, "#if 0 /* diagnostic: disable CFI */")
          p.write_text(s)
          print("CFI disabled for diagnostic build")
          PY
      - name: Compile libffi
        run: |
          cd /tmp/libffi-3.4.6
          make -j2

      - name: Inspect libffi
        run: |
          cd /tmp/libffi-3.4.6
          LIB=$(find . -name libffi.a -print -quit)
          test -n "$LIB"
          xcrun lipo -info "$LIB"
          xcrun ar -t "$LIB" | head -20

      - name: Download QEMU 9.2.0
        run: |
          curl -fL https://download.qemu.org/qemu-9.2.0.tar.xz -o /tmp/qemu.tar.xz
          tar -xJf /tmp/qemu.tar.xz -C /tmp

      - name: Setup Python for QEMU
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QEMU Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install distlib meson ninja
      - name: Configure QEMU TCI for iOS ARM64
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"

          mkdir -p /tmp/qemu-ios-build
          cd /tmp/qemu-ios-build

          PKG_CONFIG=false \
          /tmp/qemu-9.2.0/configure \
            --cc="$CLANG" \
            --cpu=aarch64 \
            --target-list=arm-linux-user \
            --enable-tcg \
            --disable-system \
            --disable-docs \
            --disable-werror \
            --extra-cflags="-target arm64-apple-ios15.0 -isysroot $SDK" \
            --extra-ldflags="-target arm64-apple-ios15.0 -isysroot $SDK" \
            -Dtcg_interpreter=true
