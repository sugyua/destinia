name: iOS Device Diagnostics

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - ".github/workflows/ios-device-diagnostics.yml"
      - "ios/**"
  workflow_dispatch:

jobs:
  ios-diagnostics:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout Destinia
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check ARM64 iOS compiler
        run: |
          cat > /tmp/ios_check.c <<'EOF'
          int destinia_ios_check(void) {
              return 42;
          }
          EOF

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -target arm64-apple-ios15.0 \
            -c /tmp/ios_check.c \
            -o /tmp/ios_check.o

          file /tmp/ios_check.o

      - name: Check build tools
        run: |
          cmake --version
          xcodebuild -showsdks

      - name: Build Unicorn for iOS ARM64
        run: |
          git clone --depth 1 --branch 2.1.4 \
            https://github.com/unicorn-engine/unicorn.git /tmp/unicorn-ios

          cmake -S /tmp/unicorn-ios -B /tmp/unicorn-ios-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_ARCH=arm

          cmake --build /tmp/unicorn-ios-build --parallel 4

          find /tmp/unicorn-ios-build \
            -name "libunicorn*.a" -print
