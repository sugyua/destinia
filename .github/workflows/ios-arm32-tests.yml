name: Destinia ARM32 Emulator Tests

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - "ios/TCIProbe/**"
      - "common/elf_image.h"
      - ".github/workflows/ios-arm32-tests.yml"
  workflow_dispatch:

jobs:
  arm32-regression:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout Destinia
        uses: actions/checkout@v4

      - name: Compile native iOS game interface
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -std=c++17 -O2 \
            -c ios/TCIProbe/main.mm \
            -o /tmp/destinia_main_ios.o
          file /tmp/destinia_main_ios.o

      - name: Clone Unicorn TCI
        run: |
          git clone --depth 1 https://github.com/1rhino2/unicorn-tci.git /tmp/unicorn-tci

      - name: Build macOS ARM32 interpreter
        run: |
          set -eux
          cmake -S /tmp/unicorn-tci/unicorn-engine-sys-tci \
            -B /tmp/unicorn-tci-macos-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUNICORN_ARCH=arm \
            -DUNICORN_INTERPRETER=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=OFF
          cmake --build /tmp/unicorn-tci-macos-build --target unicorn --parallel 2

      - name: Compile host regression tests
        run: |
          set -eux
          clang++ -std=c++17 -O2 \
            -I/tmp/unicorn-tci/unicorn-engine-sys-tci/include \
            ios/TCIProbe/probe_host_test.cpp \
            ios/TCIProbe/elf_probe.cpp \
            ios/TCIProbe/arm_import_runtime.cpp \
            /tmp/unicorn-tci-macos-build/libunicorn-static.a \
            /tmp/unicorn-tci-macos-build/libarm-softmmu.a \
            /tmp/unicorn-tci-macos-build/libunicorn-common.a \
            -lm -lpthread \
            -o /tmp/destinia_arm32_tests

      - name: Execute real ARM32 code through Unicorn TCI
        run: |
          DESTINIA_PROFILE_BLOCKS=1 DESTINIA_PROBE_FRAMES=50 /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so

      - name: Upload original game framebuffer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Destinia-RGB565-preview
          path: /tmp/destinia-frame.ppm
          if-no-files-found: error
          retention-days: 7
