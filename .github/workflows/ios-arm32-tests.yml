name: Destinia ARM32 Emulator Tests

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - "ios/TCIProbe/**"
      - "ios/tools/**"
      - "common/elf_image.h"
      - ".github/workflows/ios-arm32-tests.yml"
  workflow_dispatch:

jobs:
  arm32-regression:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout Destinia
        uses: actions/checkout@v4

      - name: Verify original Android engine version
        run: |
          python3 ios/tools/audit_game_source.py /tmp/destinia-game-source.json


      - name: Compile native iOS game interface
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -std=c++17 -O2 \
            -c ios/TCIProbe/main.mm \
            -o /tmp/destinia_main_ios.o
          file /tmp/destinia_main_ios.o

      - name: Clone Unicorn TCI
        run: |
          git clone --depth 1 https://github.com/1rhino2/unicorn-tci.git /tmp/unicorn-tci

      - name: Build macOS ARM32 interpreter
        run: |
          set -eux
          cmake -S /tmp/unicorn-tci/unicorn-engine-sys-tci \
            -B /tmp/unicorn-tci-macos-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUNICORN_ARCH=arm \
            -DUNICORN_INTERPRETER=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=OFF
          cmake --build /tmp/unicorn-tci-macos-build --target unicorn --parallel 2

      - name: Compile host regression tests
        run: |
          set -eux
          clang++ -std=c++17 -O2 \
            -I/tmp/unicorn-tci/unicorn-engine-sys-tci/include \
            ios/TCIProbe/probe_host_test.cpp \
            ios/TCIProbe/elf_probe.cpp \
            ios/TCIProbe/arm_import_runtime.cpp \
            /tmp/unicorn-tci-macos-build/libunicorn-static.a \
            /tmp/unicorn-tci-macos-build/libarm-softmmu.a \
            /tmp/unicorn-tci-macos-build/libunicorn-common.a \
            -lm -lpthread \
            -o /tmp/destinia_arm32_tests

      - name: Compare native RGB565 fill against original ARM32 renderer
        run: |
          set -eux
          DESTINIA_PROBE_FRAMES=50 /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so
          cp /tmp/destinia-frame.ppm /tmp/destinia-baseline.ppm
          DESTINIA_FAST_FILL=1 DESTINIA_PROBE_FRAMES=50 /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so
          cmp /tmp/destinia-baseline.ppm /tmp/destinia-frame.ppm
          shasum -a 256 /tmp/destinia-baseline.ppm /tmp/destinia-frame.ppm
          echo "Native RGB565 fill: pixel-identical to original ARM32"
          DESTINIA_FAST_FILL=1 DESTINIA_FAST_SPRITE=1 DESTINIA_PROBE_FRAMES=50 /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so
          cmp /tmp/destinia-baseline.ppm /tmp/destinia-frame.ppm
          echo "Native RGB565 sprite: pixel-identical to original ARM32"
          DESTINIA_DIRECT_HEAP=1 DESTINIA_FAST_FILL=1 DESTINIA_FAST_SPRITE=1 \
            DESTINIA_PROBE_FRAMES=50 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-arm32-direct.log
          cmp /tmp/destinia-baseline.ppm /tmp/destinia-frame.ppm
          echo "Native-mapped guest heap: same original RGB565 pixels"
          DESTINIA_FAST_ALPHA=1 DESTINIA_FAST_FILL=1 \
            DESTINIA_FAST_SPRITE=1 DESTINIA_DIRECT_HEAP=1 \
            DESTINIA_PROBE_FRAMES=50 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-arm32-alpha.log
          cmp /tmp/destinia-baseline.ppm /tmp/destinia-frame.ppm
          echo "Native alpha: 50-frame original RGB565 match"

      - name: Benchmark and profile original versus native graphics
        run: |
          set -euo pipefail
          DESTINIA_PROFILE_BLOCKS=1 DESTINIA_PROBE_FRAMES=50 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-arm32-baseline.log
          DESTINIA_PROFILE_BLOCKS=1 DESTINIA_FAST_FILL=1 DESTINIA_FAST_SPRITE=1 \
            DESTINIA_PROBE_FRAMES=50 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-arm32-native.log
          python3 ios/tools/summarize_arm32_perf.py \
            /tmp/destinia-arm32-baseline.log /tmp/destinia-arm32-native.log \
            /tmp/destinia-arm32-direct.log
          cat /tmp/destinia-arm32-native.log | grep 'ARM32_HOT_FUNCTION' | head -12

      - name: Endurance regression and byte-for-byte verification of all 360 frames
        run: |
          set -euo pipefail
          DESTINIA_HASH_FRAMES=1 DESTINIA_PROBE_FRAMES=360 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-frames-base.log
          cp /tmp/destinia-frame.ppm /tmp/destinia-endurance-baseline.ppm
          DESTINIA_HASH_FRAMES=1 DESTINIA_FAST_FILL=1 DESTINIA_FAST_SPRITE=1 \
            DESTINIA_PROBE_FRAMES=360 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-frames-native.log
          cmp /tmp/destinia-endurance-baseline.ppm /tmp/destinia-frame.ppm
          DESTINIA_HASH_FRAMES=1 DESTINIA_DIRECT_HEAP=1 \
            DESTINIA_FAST_FILL=1 DESTINIA_FAST_SPRITE=1 \
            DESTINIA_PROBE_FRAMES=360 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-frames-direct.log
          cmp /tmp/destinia-endurance-baseline.ppm /tmp/destinia-frame.ppm
          for mode in base native direct; do
            grep '^ARM32_FRAME_HASH' /tmp/destinia-frames-$mode.log \
              > /tmp/destinia-hashes-$mode.txt
            test "$(wc -l < /tmp/destinia-hashes-$mode.txt)" -eq 360
          done
          cmp /tmp/destinia-hashes-base.txt /tmp/destinia-hashes-native.txt
          cmp /tmp/destinia-hashes-base.txt /tmp/destinia-hashes-direct.txt
          echo "360 / 360 frames byte-identical in all 3 modes"
          DESTINIA_HASH_FRAMES=1 DESTINIA_DIRECT_HEAP=1 \
            DESTINIA_FAST_FILL=1 DESTINIA_FAST_SPRITE=1 \
            DESTINIA_FAST_ALPHA=1 DESTINIA_PROBE_FRAMES=360 \
            /tmp/destinia_arm32_tests game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-frames-alpha.log
          cmp /tmp/destinia-endurance-baseline.ppm /tmp/destinia-frame.ppm
          grep '^ARM32_FRAME_HASH' /tmp/destinia-frames-alpha.log \
            > /tmp/destinia-hashes-alpha.txt
          test "$(wc -l < /tmp/destinia-hashes-alpha.txt)" -eq 360
          cmp /tmp/destinia-hashes-base.txt /tmp/destinia-hashes-alpha.txt
          echo "Native alpha: 360/360 frames byte-identical"
          grep 'ARM32_DIRECT_HEAP' /tmp/destinia-frames-direct.log

      - name: Upload original game framebuffer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Destinia-RGB565-preview
          path: /tmp/destinia-frame.ppm
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARM32 performance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Destinia-ARM32-Performance
          path: |
            /tmp/destinia-arm32-baseline.log
            /tmp/destinia-arm32-native.log
            /tmp/destinia-arm32-direct.log
            /tmp/destinia-hashes-base.txt
            /tmp/destinia-hashes-native.txt
            /tmp/destinia-hashes-direct.txt
            /tmp/destinia-hashes-alpha.txt
            /tmp/destinia-arm32-alpha.log
          if-no-files-found: ignore
          retention-days: 7
