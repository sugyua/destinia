name: Verificar hosts e pacotes do Destinia
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/verify-codex-menu.yml, launcher/**, scripts/**, tests/**, host/**, host_zoom/**, common/**, VERSION, release/**]
  push:
    branches: [main]
    paths: [.github/workflows/verify-codex-menu.yml, common/**, host/**, host_zoom/**, launcher/**, tests/**, scripts/**, VERSION, release/manifest.json]
permissions:
  contents: read
concurrency:
  group: verify-codex-menu
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Compilar inicializadores Windows GUI para a raiz do pacote
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui -X main.hostSubdir=host" -o Destinia.exe ./launcher/main.go
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar Destinia.exe" }
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui -X main.hostSubdir=host_zoom" -o 'Destinia Zoom.exe' ./launcher/main.go
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar Destinia Zoom.exe" }
          if (!(Test-Path 'Destinia.exe') -or !(Test-Path 'Destinia Zoom.exe')) { throw "Inicializadores ausentes" }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-unicorn
            mingw-w64-ucrt-x86_64-zlib
      - name: Compilar os dois hosts com audio
        shell: msys2 {0}
        run: |
          set -eu
          echo "DESTINIA_MSYS2_ROOT=$(cygpath -w /)" >> "$GITHUB_ENV"
          version=$(tr -d '\r\n' < VERSION)
          for target in host host_zoom; do
            cmake -S "$target" -B "$target/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build "$target/build"
            test "$("$target/build/destinia_host.exe" --version | tr -d '\r\n')" = "Destinia $version Beta"
            grep -q 'SDL2_MIXER_FOUND:INTERNAL=1' "$target/build/CMakeCache.txt"
          done
      - name: Testar ARM estabilidade preferencias Codex e empacotamento
        shell: msys2 {0}
        env:
          DESTINIA_NATIVE_TESTS: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -eu
          for pattern in test_inventory_view.py test_combat_power.py test_drop_names.py test_runtime.py test_preferences.py test_preferences_host.py test_codex.py test_codex_native.py test_codex_details.py test_codex_details_ui.py test_codex_portraits.py test_zoom_camera.py test_safe_save.py test_offline_store.py test_save_modes.py test_touch_controls.py test_ui_transform.py test_text_labels.py test_release_coherence.py test_package_release.py test_package_windows.py; do
            python -m unittest discover -s tests -p "$pattern" -v
          done
          DESTINIA_ZOOM_EXE="$PWD/host_zoom/build/destinia_host.exe" python -m unittest discover -s tests -p test_zoom_render.py -v
      - name: Verificar configuradores e diagnostico PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('test_diagnostic.ps1','test_camera_mode.ps1','test_save_configuration.ps1','test_game_preferences.ps1','test_configurator_native.ps1','test_launchers.ps1','test_root_executables.ps1','test_prompt.ps1','test_update_0130.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' $name)
            if($LASTEXITCODE -ne 0) {throw "Falhou: $name"}
          }
      - name: Empacotar fontes EXEs e checksums sem dependencias externas
        shell: msys2 {0}
        run: |
          set -eu
          python scripts/package_release.py --out dist
          python scripts/package_windows.py --out dist --normal host/build/destinia_host.exe --zoom host_zoom/build/destinia_host.exe --launcher-normal Destinia.exe --launcher-zoom 'Destinia Zoom.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: destinia-codex-no-menu-pacotes-de-teste
          path: dist/*
          if-no-files-found: error
