name: Destinia ARM32 Gameplay Profiling

on:
  push:
    branches:
      - ios/unicorn-poc
    paths:
      - ".github/workflows/ios-gameplay-profiler.yml"
  workflow_dispatch:

jobs:
  menu-navigation-profile:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - name: Checkout original game
        uses: actions/checkout@v4

      - name: Check original ELF provenance
        run: python3 ios/tools/audit_game_source.py

      - name: Build Release Unicorn TCI for macOS ARM64
        run: |
          set -eux
          git clone --depth 1 https://github.com/1rhino2/unicorn-tci.git /tmp/unicorn-tci
          cmake -S /tmp/unicorn-tci/unicorn-engine-sys-tci \
            -B /tmp/unicorn-tci-gameplay-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUNICORN_ARCH=arm \
            -DUNICORN_INTERPRETER=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=OFF
          cmake --build /tmp/unicorn-tci-gameplay-build --target unicorn --parallel 2

      - name: Compile original ARM32 game scenario runner
        run: |
          set -eux
          clang++ -std=c++17 -O3 -DDESTINIA_NATIVE_GFX=1 \
            -DDESTINIA_NATIVE_HEAP=1 \
            -I/tmp/unicorn-tci/unicorn-engine-sys-tci/include \
            ios/TCIProbe/probe_host_test.cpp \
            ios/TCIProbe/elf_probe.cpp \
            ios/TCIProbe/arm_import_runtime.cpp \
            /tmp/unicorn-tci-gameplay-build/libunicorn-static.a \
            /tmp/unicorn-tci-gameplay-build/libarm-softmmu.a \
            /tmp/unicorn-tci-gameplay-build/libunicorn-common.a \
            -lm -lpthread -o /tmp/destinia-gameplay-test

      - name: Touch title and capture intermediate original frames
        run: |
          set -euo pipefail
          DESTINIA_PROBE_FRAMES=280 \
            DESTINIA_AUTOTOUCH="65,200,211;120,200,67" \
            DESTINIA_CAPTURE_FRAMES="90,130,160,190,220,260" \
            DESTINIA_PROFILE_BLOCKS=1 \
            DESTINIA_PROFILE_FRAME=220 \
            /tmp/destinia-gameplay-test game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-gameplay.log
          grep -E "ARM32_TOUCH|ARM32_HOT_FUNCTION|ARM32_FRAME_PERF frame=(65|90|130|180|220|260)" /tmp/destinia-gameplay.log
          for frame in 90 130 160 190 220 260; do
            test -s "/tmp/destinia-stage-$frame.ppm"
          done

      - name: Compare native ALPHA16 on original character-selection frames
        run: |
          set -euo pipefail
          for frame in 90 130 160 190 220 260; do
            cp "/tmp/destinia-stage-$frame.ppm" "/tmp/destinia-reference-$frame.ppm"
          done
          DESTINIA_FAST_ALPHA16=1 DESTINIA_PROBE_FRAMES=280 \
            DESTINIA_AUTOTOUCH="65,200,211;120,200,67" \
            DESTINIA_CAPTURE_FRAMES="90,130,160,190,220,260" \
            /tmp/destinia-gameplay-test game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-alpha.log
          for frame in 90 130 160 190 220 260; do
            cmp "/tmp/destinia-reference-$frame.ppm" "/tmp/destinia-stage-$frame.ppm"
          done
          echo "Six original game menu frames identical with native ALPHA16"
          grep 'ARM32_FRAME_PERF frame=220' /tmp/destinia-gameplay.log /tmp/destinia-alpha.log

      - name: Compare all original menu frames with optimized alpha renderer
        run: |
          set -euo pipefail
          export DESTINIA_PROBE_FRAMES=240
          export DESTINIA_AUTOTOUCH="65,200,211;120,200,67"
          export DESTINIA_HASH_FRAMES=1
          /tmp/destinia-gameplay-test game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-menu-baseline.log
          DESTINIA_FAST_ALPHA=1 \
            /tmp/destinia-gameplay-test game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-menu-alpha.log
          grep '^ARM32_FRAME_HASH' /tmp/destinia-menu-baseline.log > /tmp/destinia-menu-hashes-baseline.txt
          grep '^ARM32_FRAME_HASH' /tmp/destinia-menu-alpha.log > /tmp/destinia-menu-hashes-alpha.txt
          test "$(wc -l < /tmp/destinia-menu-hashes-baseline.txt)" -eq 240
          cmp /tmp/destinia-menu-hashes-baseline.txt /tmp/destinia-menu-hashes-alpha.txt
          echo 'MENU ALPHA: 240/240 game frames byte-identical'
          echo '=== Before alpha optimization ==='
          grep '^ARM32_HOT_FUNCTION' /tmp/destinia-menu-baseline.log | head -12
          echo '=== After alpha optimization ==='
          grep '^ARM32_HOT_FUNCTION' /tmp/destinia-menu-alpha.log | head -12

      - name: Verify combined native alpha function and image-row acceleration
        run: |
          set -euo pipefail
          DESTINIA_FAST_ALPHA16=1 DESTINIA_FAST_ALPHA=1 \
            DESTINIA_PROBE_FRAMES=240 \
            DESTINIA_AUTOTOUCH="65,200,211;120,200,67" \
            DESTINIA_HASH_FRAMES=1 \
            /tmp/destinia-gameplay-test game/lib/armeabi/libdestinia_jni.so \
            2> /tmp/destinia-menu-alpha-combined.log
          grep '^ARM32_FRAME_HASH' /tmp/destinia-menu-alpha-combined.log \
            > /tmp/destinia-menu-hashes-combined.txt
          test "$(wc -l < /tmp/destinia-menu-hashes-combined.txt)" -eq 240
          cmp /tmp/destinia-menu-hashes-baseline.txt \
              /tmp/destinia-menu-hashes-combined.txt
          echo 'ALPHA COMBINADO: 240/240 frames identicos ao jogo original'
          grep 'ARM32_FRAME_PERF frame=220' /tmp/destinia-menu-alpha-combined.log

      - name: Upload scene progression and hot functions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Destinia-Gameplay-Profiling
          path: |
            /tmp/destinia-stage-*.ppm
            /tmp/destinia-gameplay.log
            /tmp/destinia-alpha.log
            /tmp/destinia-menu-baseline.log
            /tmp/destinia-menu-alpha.log
            /tmp/destinia-menu-hashes-baseline.txt
            /tmp/destinia-menu-hashes-alpha.txt
            /tmp/destinia-menu-hashes-combined.txt
            /tmp/destinia-menu-alpha-combined.log
          if-no-files-found: warn
          retention-days: 7
