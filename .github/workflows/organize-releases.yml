name: Organizar releases Beta por lancamento
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/organize-releases.yml]
permissions:
  contents: write
concurrency:
  group: organize-destinia-releases
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-24.04
    steps:
      - name: Padronizar classificacao Beta preservando datas tags e downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,subprocess,time
          repository=os.environ['GITHUB_REPOSITORY']
          approved={'v0.2-beta','v0.3-beta','v0.4-beta','v0.5-beta','v0.6-beta','v0.7-beta','v0.7-codex-imagens','v0.7-codex-imagens-fix1','v0.7-codex-imagens-fix2'}
          def api(endpoint,payload=None):
              command=['gh','api',endpoint]
              if payload is not None:command+=['--method','PATCH','--input','-']
              result=subprocess.run(command,input=json.dumps(payload) if payload is not None else None,capture_output=True,text=True,check=True)
              return json.loads(result.stdout)
          def preserved(release):
              return {k:release[k] for k in ['id','tag_name','target_commitish','name','draft','created_at','published_at','body']} | {'assets':[{k:a.get(k) for k in ['id','name','size','digest','browser_download_url']} for a in release['assets']]}
          releases=api('repos/'+repository+'/releases?per_page=100')
          targets=[r for r in releases if r['tag_name'] in approved]
          if {r['tag_name'] for r in targets}!=approved:raise RuntimeError('A lista de releases mudou; revisar antes de organizar')
          for release in targets:
              if release['draft']:raise RuntimeError('Rascunho inesperado; nenhuma publicacao autorizada')
              if not release['prerelease']:
                  updated=api('repos/'+repository+'/releases/'+str(release['id']),{'prerelease':True})
                  if preserved(updated)!=preserved(release):raise RuntimeError('Metadados ou downloads alterados indevidamente')
                  print('Classificacao Beta corrigida:',release['tag_name'])
          # Release classification is indexed asynchronously by GitHub.
          for attempt in range(10):
              result=api('repos/'+repository+'/releases?per_page=100')
              ordered=[r for r in result if r['tag_name'] in approved]
              expected=sorted(ordered,key=lambda r:r['published_at'],reverse=True)
              if all(r['prerelease'] for r in ordered) and [r['id'] for r in ordered]==[r['id'] for r in expected]:break
              if attempt<9:time.sleep(3)
          else:raise RuntimeError('Ordem ainda nao convergiu; revisar ordenacao do GitHub')
          print('Ordem retornada:',[r['tag_name'] for r in ordered])
          print('RELEASE_ORDER_OK: datas tags notas e assets preservados')
