<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destinia — laboratório de rede</title><link rel="stylesheet" href="/style.css">
<h1>Destinia — laboratório de rede</h1><p><strong>SIMULAÇÃO SEPARADA DO JOGO.</strong> HP, gold e item fictícios; não usa seus saves. Não habilita PvP/Leilão nos menus originais.</p>
<form id="join"><label>Nome <input name="name" maxlength="24" required></label><label>Sala combinada <input name="room" pattern="[a-zA-Z0-9_-]{1,40}" maxlength="40" required></label><button>Entrar na sala</button></form>
<p id="status" role="status">Desconectado.</p><main id="session" hidden><h2 id="room"></h2><h3>PvP simulado</h3><ul id="players"></ul><button id="attack">Atacar oponente (-10 HP)</button> <button id="hp">Restaurar meu HP</button><h3>Leilão simulado</h3><p id="auction"></p><form id="bid"><label>Lance <input name="amount" type="number" min="1" max="1000" step="1" required></label><button>Enviar lance</button></form><button id="close">Finalizar leilão de teste</button> <button id="leave">Sair</button><h3>Eventos recentes</h3><ol id="events"></ol></main><script src="/app.js"></script></html>
